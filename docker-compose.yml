name: minimarket

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-minimarket}
      MYSQL_USER: ${MYSQL_USER:-minimarket}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-minimarket}
      TZ: America/Lima
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --ngram-token-size=2
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      # Dentro de Docker el host de la base de datos es el servicio "mysql"
      DATABASE_URL: mysql+aiomysql://${MYSQL_USER:-minimarket}:${MYSQL_PASSWORD:-minimarket}@mysql:3306/${MYSQL_DATABASE:-minimarket}?charset=utf8mb4
      WEB_WORKERS: ${WEB_WORKERS:-2}
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8010}:8000"

  frontend:
    build:
      context: ./frontend
      args:
        # El navegador solo habla con el frontend; Next reenvía /api/v1 al backend por la red interna
        BACKEND_URL: http://backend:8000
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3010}:3000"

volumes:
  mysql_data:
